<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나의 AI 비서 Sancho</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sancho">
<style>
  :root { --line: #e4e7eb; --bg: #f5f6f8; --text: #1b1f24; --sub: #667085; --blue: #2f6fed; --blue-bg: #eaf1ff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  @supports (height: 100dvh) { html, body { height: 100dvh; } } /* 폰 브라우저의 주소창이 접히고 펴져도 화면 높이가 맞게 */
  button, a { touch-action: manipulation; } /* 두 번 눌러 확대되며 한 박자 늦는 것을 없앤다 */
  body { margin: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column;
    font: 15px/1.55 "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
  button { font: inherit; cursor: pointer; }

  /* 위쪽 바 */
  header { flex: none; height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 16px;
    background: #fff; border-bottom: 1px solid var(--line); position: relative; z-index: 10; }
  header .brand { font-weight: 700; font-size: 17px; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  header .brand span { color: var(--blue); }
  header .brand .bn { color: inherit; }
  header .space { flex: 1; }
  .icon-btn { display: none; width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font-size: 18px; }
  .chip { flex: none; white-space: nowrap; display: flex; align-items: center; gap: 8px; padding: 5px 6px 5px 12px; border: 1px solid var(--line);
    border-radius: 999px; background: #fff; font-size: 14px; }
  .chip small { padding: 2px 8px; border-radius: 999px; background: #f2f4f7; color: var(--sub); font-size: 12px; }
  .chip:hover small { background: #fee4e2; color: #b42318; }
  [hidden] { display: none !important; }

  /* 🔔 알림 단추·목록·결과 창 */
  .bell { position: relative; flex: none; width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 999px; background: #fff; font-size: 18px; line-height: 1; }
  .bell:hover, .bell[aria-expanded="true"] { border-color: var(--blue); background: var(--blue-bg); }
  .badge { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px;
    background: #d92d20; color: #fff; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; }
  .bellpanel { position: fixed; z-index: 30; top: 60px; right: 12px; width: min(400px, calc(100vw - 24px)); max-height: min(70vh, 560px);
    display: flex; flex-direction: column; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 32px rgba(16, 24, 40, .18); }
  .bp-head { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--line); font-weight: 700; }
  .bp-head button { border: 0; background: none; color: var(--blue); font-size: 13px; }
  .bp-head button:disabled { color: #98a2b3; cursor: default; }
  .bp-list { overflow-y: auto; padding: 4px; }
  .nrow { display: flex; align-items: flex-start; gap: 10px; width: 100%; padding: 9px 10px; border: 0; border-radius: 8px; background: none; text-align: left; color: inherit; }
  .nrow:hover { background: #f2f4f7; }
  .nrow .dot { flex: none; width: 8px; height: 8px; margin-top: 7px; border-radius: 50%; background: transparent; }
  .nrow.unread .dot { background: var(--blue); }
  .nrow.warn.unread .dot { background: #d92d20; }
  .nrow .nt { flex: 1; min-width: 0; }
  .nrow .nt b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nrow.unread .nt b { font-weight: 700; }
  .nrow .nt span { display: block; color: var(--sub); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nrow time { flex: none; color: var(--sub); font-size: 12px; font-variant-numeric: tabular-nums; }
  .bp-none { padding: 22px; text-align: center; color: var(--sub); font-size: 14px; }
  .bp-foot { flex: none; padding: 6px 14px 10px; color: var(--sub); font-size: 12px; }
  .modal { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(16, 24, 40, .45); }
  .mcard { width: min(720px, 100%); max-height: 85vh; display: flex; flex-direction: column; background: #fff; border-radius: 14px; box-shadow: 0 20px 48px rgba(16, 24, 40, .3); }
  .mhead { flex: none; display: flex; align-items: flex-start; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .mhead .mt { flex: 1; min-width: 0; }
  .mhead h2 { margin: 0; font-size: 17px; overflow-wrap: anywhere; }
  .mhead .meta { margin-top: 4px; color: var(--sub); font-size: 13px; }
  .mhead button { flex: none; width: 32px; height: 32px; border: 0; border-radius: 8px; background: none; color: var(--sub); font-size: 16px; }
  .mhead button:hover { background: #f2f4f7; color: var(--text); }
  .mbody { overflow-y: auto; padding: 14px 18px 18px; }
  .lvl { padding: 1px 8px; border-radius: 999px; background: #f2f4f7; color: var(--sub); font-size: 12px; }
  .lvl.warn { background: #fee4e2; color: #b42318; }

  /* 본문: 왼쪽 메뉴 + 내용 */
  .body { flex: 1; min-height: 0; display: flex; position: relative; }
  nav { flex: none; width: 200px; padding: 12px 10px; overflow-y: auto; background: #fff; border-right: 1px solid var(--line); }
  nav a { display: block; padding: 9px 12px; margin-bottom: 2px; border-radius: 8px; color: #344054; text-decoration: none; }
  nav a:hover { background: #f2f4f7; }
  nav a.on { background: var(--blue-bg); color: var(--blue); font-weight: 600; }
  main { flex: 1; min-width: 0; display: flex; }
  .soon { margin: auto; text-align: center; color: var(--sub); padding: 24px; }
  .soon h2 { color: var(--text); margin: 0 0 6px; }

  /* AI 채팅 */
  #chat { flex: 1; min-width: 0; display: flex; }
  .chatlist { flex: none; width: 256px; display: flex; flex-direction: column; background: #fff; border-right: 1px solid var(--line); }
  .chatlist .new { margin: 12px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; font-weight: 600; color: var(--blue); }
  .chatlist .new:hover { background: var(--blue-bg); }
  #list { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
  #list button { display: block; width: 100%; padding: 9px 12px; margin-bottom: 2px; border: 0; border-radius: 8px; background: none;
    text-align: left; color: #344054; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #list button:hover { background: #f2f4f7; }
  #list button.on { background: var(--blue-bg); color: var(--blue); }
  #list .none { padding: 8px 12px; color: var(--sub); font-size: 13px; }
  #list { min-height: 72px; }
  .memory, .sched { flex: none; max-height: 28%; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
  .sched { max-height: 40%; }
  .memory h3, .sched h3 { margin: 0; padding: 10px 16px 6px; font-size: 13px; color: var(--sub); }
  /* 예약 칸: [스위치] 이름 + 언제 · ▶ 지금 실행 · ✕ 삭제 */
  #sch { overflow-y: auto; padding: 0 8px 10px; }
  .sitem { display: flex; align-items: center; gap: 6px; padding: 5px 6px; border-radius: 8px; }
  /* 📱 휴대폰(텔레그램)으로도 보내기 체크: 꺼짐은 흐리게, 켜짐은 또렷하게 */
  .sitem .ph { position: relative; flex: none; width: 24px; height: 24px; }
  .sitem .ph input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
  .sitem .ph span { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; border-radius: 6px; font-size: 14px; filter: grayscale(1); opacity: .4; pointer-events: none; }
  .sitem .ph input:checked + span { filter: none; opacity: 1; background: var(--blue-bg); }
  .sitem .ph input:focus-visible + span { outline: 2px solid var(--blue); }
  .sitem:hover { background: #f2f4f7; }
  .sitem .st { flex: 1; min-width: 0; }
  .sitem .st b { display: block; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sitem .st small { display: block; color: var(--sub); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sitem.off .st { opacity: .55; }
  .sitem.bad .st small { color: #b42318; }
  .sitem > button { flex: none; width: 24px; height: 24px; border: 0; border-radius: 6px; background: none; color: var(--sub); }
  .sitem > button[data-run]:hover:not(:disabled) { background: var(--blue-bg); color: var(--blue); }
  .sitem > button[data-del]:hover:not(:disabled) { background: #fee4e2; color: #b42318; }
  .sitem > button:disabled { opacity: .35; cursor: default; }
  .sw { position: relative; flex: none; width: 32px; height: 18px; }
  .sw input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
  .sw span { position: absolute; inset: 0; border-radius: 999px; background: #d0d5dd; transition: background .15s; pointer-events: none; }
  .sw span::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .sw input:checked + span { background: var(--blue); }
  .sw input:checked + span::after { transform: translateX(14px); }
  .sw input:focus-visible + span { outline: 2px solid var(--blue); outline-offset: 2px; }
  #sch .none { padding: 4px 8px; color: var(--sub); font-size: 12px; }
  #mem { overflow-y: auto; padding: 0 8px 10px; }
  #mem .item { display: flex; gap: 6px; align-items: flex-start; padding: 6px 8px; border-radius: 8px; font-size: 13px; line-height: 1.45; }
  #mem .item:hover { background: #f2f4f7; }
  #mem .item span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  #mem .item button { flex: none; width: 24px; height: 24px; border: 0; border-radius: 6px; background: none; color: var(--sub); }
  #mem .item button:hover { background: #fee4e2; color: #b42318; }
  #mem .none { padding: 4px 8px; color: var(--sub); font-size: 12px; }
  .pane { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .pane-top { display: none; padding: 8px 12px; border-bottom: 1px solid var(--line); background: #fff; }
  .pane-top button { padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  #msgs { flex: 1; overflow-y: auto; padding: 24px 16px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .empty { margin-top: 12vh; text-align: center; color: var(--sub); }
  .empty h2 { color: var(--text); margin: 0 0 6px; }
  .row { display: flex; margin-bottom: 14px; }
  .row.user { justify-content: flex-end; }
  .bubble { max-width: 85%; padding: 10px 14px; border-radius: 14px; overflow-wrap: anywhere; }
  .user .bubble { background: var(--blue); color: #fff; border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .assistant .bubble { background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .typing { color: var(--sub); }
  .composer { flex: none; padding: 12px 16px 16px; background: var(--bg); }
  .box { max-width: 760px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px; padding: 8px; background: #fff;
    border: 1px solid #d0d5dd; border-radius: 14px; }
  .box:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(47, 111, 237, .12); }
  textarea { flex: 1; min-width: 0; max-height: 180px; padding: 8px; border: 0; outline: none; resize: none; font: inherit; background: none; }
  #send { flex: none; width: 40px; height: 40px; border: 0; border-radius: 50%; background: var(--blue); color: #fff; font-size: 18px; }
  #send:disabled { background: #98a2b3; cursor: default; }
  #send.stop { background: #475467; }
  .hint { max-width: 760px; margin: 6px auto 0; color: var(--sub); font-size: 12px; text-align: center; }
  /* 첨부: ＋ 단추 · 올린 파일 칩(이미지는 미리보기) · 끌어다 놓는 자리 표시 */
  .pane { position: relative; }
  .pane.drag::after { content: '여기에 놓으면 첨부돼요'; position: absolute; inset: 8px; z-index: 5; display: flex; align-items: center; justify-content: center; border: 2px dashed var(--blue); border-radius: 14px;
    background: rgba(234, 241, 255, .9); color: var(--blue); font-size: 18px; font-weight: 600; pointer-events: none; }
  .plus { flex: none; width: 40px; height: 40px; border: 0; border-radius: 10px; background: #f2f4f7; color: #475467; font-size: 22px; line-height: 1; }
  .plus:hover { background: var(--blue-bg); color: var(--blue); }
  .tray { max-width: 760px; margin: 0 auto 8px; display: flex; flex-wrap: wrap; gap: 8px; }
  .tray[hidden] { display: none; }
  .att { display: flex; align-items: center; gap: 8px; max-width: 250px; padding: 5px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  .att img, .att .ic { flex: none; width: 44px; height: 44px; border-radius: 6px; }
  .att img { object-fit: cover; }
  .att .ic { display: flex; align-items: center; justify-content: center; background: #f2f4f7; font-size: 22px; }
  .att .nm { min-width: 0; flex: 1; display: flex; flex-direction: column; font-size: 13px; line-height: 1.35; }
  .att .nm .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .att .nm small { color: var(--sub); font-size: 11px; }
  .att.up { opacity: .6; } .att.err { border-color: #fecdca; background: #fef3f2; } .att.err .nm small { color: #b42318; }
  .att .x { flex: none; width: 22px; height: 22px; border: 0; border-radius: 6px; background: none; color: var(--sub); }
  .att .x:hover { background: #fee4e2; color: #b42318; }
  /* 말풍선 안의 첨부(이미지 미리보기·파일 이름)와 비서가 만든 파일 카드 */
  .atts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .athumb img { display: block; max-width: 200px; max-height: 150px; border-radius: 8px; }
  .afile { padding: 4px 10px; border-radius: 8px; background: rgba(255, 255, 255, .22); color: #fff; font-size: 13px; text-decoration: none; overflow-wrap: anywhere; }
  .fcard { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fafbfc; }
  .fcard .ic { flex: none; font-size: 26px; }
  .fcard .fi { flex: 1; min-width: 0; } .fcard .fi b { display: block; overflow-wrap: anywhere; } .fcard .fi small { color: var(--sub); }
  .fcard .fa { flex: none; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
  .fcard .fa button, .fcard .fa a { padding: 5px 10px; border: 1px solid #d0d5dd; border-radius: 8px; background: #fff; color: #344054; font-size: 13px; text-decoration: none; }
  .fcard .fa button:hover, .fcard .fa a:hover { background: #f2f4f7; }
  /* 파일 보기 창 */
  #viewer .mcard { width: min(960px, 100%); max-height: 90vh; }
  #vBody .soft { color: var(--sub); }
  #vBody h4 { margin: 14px 0 6px; font-size: 14px; }
  #vBody .vt { overflow: auto; }
  #vBody table { border-collapse: collapse; font-size: 13px; }
  #vBody th, #vBody td { padding: 4px 9px; border: 1px solid var(--line); text-align: left; vertical-align: top; white-space: pre-wrap; }
  #vBody th { background: #f2f4f7; }
  #vBody .vimg { max-width: 100%; display: block; margin: 0 auto; }
  #vBody .vpdf { width: 100%; height: 70vh; border: 0; }
  #vBody pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.6 Consolas, "Malgun Gothic", monospace; }
  #vBody .vdoc p { margin: 0 0 .6em; white-space: pre-wrap; }
  #vBody .slide { margin: 0 0 10px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; }
  /* 입력창 왼쪽: 지금 켜진 권한 (모두 꺼져 있으면 🔒) */
  .perm { flex: none; display: flex; flex-direction: column; gap: 2px; align-self: center; padding: 0 2px 0 6px; }
  .perm span { padding: 1px 7px; border-radius: 999px; background: var(--blue-bg); color: var(--blue); font-size: 11px; line-height: 16px; white-space: nowrap; }
  .perm span.warn { background: #fee4e2; color: #b42318; }
  .perm span.lock { padding: 0; background: none; color: var(--sub); font-size: 14px; }

  /* 마크다운 */
  .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 .7em; } .md h1, .md h2, .md h3, .md h4 { margin: .9em 0 .4em; font-size: 1.05em; }
  .md ul, .md ol { margin: 0 0 .7em; padding-left: 1.4em; }
  .md code { padding: 1px 5px; border-radius: 5px; background: #f2f4f7; font: 13px Consolas, monospace; }
  .md pre { margin: 0 0 .7em; padding: 12px; border-radius: 8px; background: #f2f4f7; overflow-x: auto; }
  .md pre code { padding: 0; background: none; }
  .md blockquote { margin: 0 0 .7em; padding: 2px 12px; border-left: 3px solid #d0d5dd; color: var(--sub); }
  .md table { margin-bottom: .7em; border-collapse: collapse; display: block; overflow-x: auto; }
  .md th, .md td { padding: 6px 12px; border: 1px solid var(--line); text-align: left; }
  .md .toolline { color: var(--sub); font-size: 13px; } .md .warnline { color: #b42318; }
  .md th { background: #f9fafb; } .md a { color: var(--blue); } .md hr { border: 0; border-top: 1px solid var(--line); }

  /* 대시보드 (채팅 위 한 줄) */
  .home { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .home #chat { min-height: 0; }
  .dash { flex: none; display: grid; grid-template-columns: minmax(230px, 290px) 1fr; gap: 12px; padding: 12px 16px;
    border-bottom: 1px solid var(--line); background: var(--bg); }
  .hello { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; }
  .hello h2 { margin: 0; font-size: 18px; }
  .hello .date { color: var(--sub); font-size: 13px; }
  .dash .note { margin-top: 4px; color: #b42318; font-size: 12px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .stat { display: block; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: inherit; text-decoration: none; }
  .stat:hover { border-color: var(--blue); background: var(--blue-bg); }
  .stat b { display: block; font-size: 22px; line-height: 1.2; }
  .stat span { font-size: 12px; color: var(--sub); }
  .stat.warn b { color: #b42318; }
  .stat.wide { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 10px; padding: 5px 12px; } /* 결재할 문서: 한 줄짜리 카드 (대시보드 높이를 많이 늘리지 않게) */
  .stat.wide b { display: inline; font-size: 18px; }
  .lists { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .lcard { display: flex; flex-direction: column; min-height: 0; max-height: 176px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  .lcard h3 { flex: none; margin: 0; padding: 8px 12px 4px; font-size: 13px; color: var(--sub); }
  .lcard ul { flex: 1; overflow-y: auto; margin: 0; padding: 0 6px 6px; list-style: none; }
  .lcard li { display: flex; gap: 8px; padding: 3px 6px; border-radius: 6px; font-size: 13px; line-height: 1.45; }
  .lcard li[data-chat] { cursor: pointer; }
  .lcard li[data-chat]:hover { background: #f2f4f7; }
  .lcard .k { flex: none; min-width: 3.2em; color: var(--sub); font-variant-numeric: tabular-nums; }
  .lcard .k.late { color: #b42318; font-weight: 600; }
  .lcard .tt { min-width: 0; overflow: hidden; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .lcard .none { padding: 6px; color: var(--sub); font-size: 13px; }
  .quick { max-width: 760px; margin: 0 auto 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .quick button { padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: #344054; font-size: 13px; }
  .quick button:hover { border-color: var(--blue); background: var(--blue-bg); color: var(--blue); }

  .frame { flex: 1; min-width: 0; border: 0; background: var(--bg); }

  /* 설정 */
  .settings { flex: 1; min-width: 0; overflow-y: auto; padding: 24px 16px; }
  .settings > * { max-width: 900px; margin-left: auto; margin-right: auto; }
  .settings h2 { margin-bottom: 14px; }
  .card { margin-bottom: 16px; padding: 18px 20px; background: #fff; border: 1px solid var(--line); border-radius: 12px; }
  .card h3 { margin: 0 0 4px; font-size: 16px; }
  .card p { margin: 0 0 12px; color: var(--sub); font-size: 14px; }
  .btn { padding: 9px 16px; border: 0; border-radius: 10px; background: var(--blue); color: #fff; font-weight: 600; }
  .btn:disabled { background: #98a2b3; cursor: default; }
  #seedMsg { margin-top: 10px; font-size: 14px; }
  .permrow { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; }
  .permrow + .permrow { border-top: 1px solid var(--line); }
  .permrow .sw { margin-top: 3px; }
  .permrow .st { flex: 1; min-width: 0; }
  .permrow b { display: block; font-size: 14px; }
  .permrow small { display: block; margin-top: 2px; color: var(--sub); font-size: 13px; line-height: 1.5; }
  .permrow.danger b::after { content: ' ⚠'; color: #b42318; }
  #permMsg { margin-top: 6px; font-size: 14px; } #permMsg.err { color: #b42318; }
  .card h3 small { font-weight: 400; color: var(--sub); font-size: 13px; }
  /* 텔레그램 배달: 왼쪽 입력 칸 + 오른쪽 도움말 */
  .tgbox { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 20px; align-items: start; }
  #tgState { margin-bottom: 12px; color: var(--sub); font-size: 13px; }
  .tgform label { display: block; margin-bottom: 12px; font-size: 13px; font-weight: 600; color: #344054; }
  .tgform input { display: block; width: 100%; margin-top: 4px; padding: 9px 12px; border: 1px solid #d0d5dd; border-radius: 10px; font: inherit; font-weight: 400; }
  .tgform input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(47, 111, 237, .12); }
  /* 토큰·채팅 ID 는 입력하는 동안 ●●● 로 가린다. 비밀번호 칸(type=password)을 쓰지 않는 이유: 브라우저가 "비밀번호 저장?"으로
     토큰을 비밀번호 관리자(클라우드 동기화)에 넣을 수 있어서 */
  .tgform input.mask { -webkit-text-security: disc; }
  .tgbtns { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn.ghost { background: #fff; color: #344054; border: 1px solid #d0d5dd; }
  .btn.ghost:disabled { color: #98a2b3; }
  #tgMsg { margin-top: 10px; font-size: 14px; min-height: 1.5em; }
  #tgMsg.err { color: #b42318; }
  .tghelp { padding: 12px 16px; border: 1px solid var(--line); border-radius: 10px; background: #f9fafb; font-size: 13px; line-height: 1.6; }
  .tghelp h4 { margin: 0 0 6px; font-size: 14px; }
  .tghelp ol { margin: 0 0 8px; padding-left: 1.3em; }
  .tghelp li { margin-bottom: 5px; }
  .tghelp p { margin: 0 0 6px; font-size: 13px; }
  .tghelp code, .card p code { padding: 1px 5px; border-radius: 5px; background: #eef0f3; font: 12px Consolas, monospace; }
  /* 설정 위쪽 탭(일반 · 사용자) */
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
  .tabs a { padding: 8px 16px; margin-bottom: -1px; border-bottom: 2px solid transparent; color: var(--sub); text-decoration: none; font-weight: 600; }
  .tabs a:hover { color: var(--text); }
  .tabs a.on { color: var(--blue); border-bottom-color: var(--blue); }
  /* 사용자: 목록 표 + 추가 폼 */
  .utable { overflow-x: auto; margin-bottom: 8px; }
  .utable table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .utable th, .utable td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  .utable th { color: var(--sub); font-size: 13px; font-weight: 600; }
  .utable.sm td { white-space: normal; vertical-align: top; } .utable td small { display: block; margin-top: 2px; color: var(--sub); font-size: 12px; } .utable td.bad { color: #b42318; }
  .utable .role { padding: 1px 8px; border-radius: 999px; background: #f2f4f7; color: var(--sub); font-size: 12px; }
  .utable .role.admin { background: var(--blue-bg); color: var(--blue); }
  .utable .first { color: #b54708; font-size: 12px; }
  .uform { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; align-items: end; }
  .uform label { display: block; font-size: 13px; font-weight: 600; color: #344054; }
  .uform input, .uform select { display: block; width: 100%; margin-top: 4px; padding: 9px 12px; border: 1px solid #d0d5dd; border-radius: 10px; font: inherit; font-weight: 400; background: #fff; }
  .uform input:focus, .uform select:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(47, 111, 237, .12); }
  .uform input.mask { -webkit-text-security: disc; }
  .uform .show { display: flex; align-items: center; gap: 6px; font-weight: 400; color: var(--sub); }
  .uform .show input { width: auto; margin: 0; }
  #userMsg { margin-top: 10px; font-size: 14px; min-height: 1.5em; } #userMsg.err { color: #b42318; }

  /* 아래 탭(채팅·대시보드·일정)과 메뉴 뒤의 어두운 막: 폰에서만 보인다 */
  .tabbar, .scrim { display: none; }
  .tabbar { flex: none; background: #fff; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  .tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 7px 0 6px; border: 0; background: none; color: var(--sub); font-size: 12px; line-height: 1.25; }
  .tabbar button i { font-style: normal; font-size: 20px; filter: grayscale(1); opacity: .65; }
  .tabbar button.on { color: var(--blue); font-weight: 700; }
  .tabbar button.on i { filter: none; opacity: 1; }
  .scrim { position: absolute; inset: 0; z-index: 4; background: rgba(16, 24, 40, .35); }

  /* 휴대폰 (폭 800px 이하): 왼쪽 메뉴는 ☰ 로 접히고, 채팅·대시보드·일정은 아래 탭으로 한 칸씩 */
  @media (max-width: 800px) {
    body { padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
    header { gap: 6px; padding: 0 10px; }
    header .brand { font-size: 15px; }
    header .brand .bn { display: none; } /* 좁으면 "Sancho" 만 */
    .bell { width: 38px; height: 38px; }
    .chip { gap: 6px; font-size: 13px; }
    #whoName { display: inline-block; max-width: 7em; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; }
    .icon-btn { display: block; width: 40px; height: 40px; }
    .tgbox { grid-template-columns: 1fr; }
    nav { position: absolute; z-index: 5; top: 0; bottom: 0; left: 0; width: min(260px, 82%); transform: translateX(-100%); transition: transform .2s; }
    nav a { padding: 12px; } /* 손가락으로 누르기 좋게 */
    body.menu nav { transform: none; box-shadow: 4px 0 20px rgba(0,0,0,.1); } /* 그림자는 열렸을 때만 (접힌 메뉴의 그림자가 화면 가장자리로 새지 않게) */
    body.menu .scrim { display: block; } /* 메뉴 밖을 누르면 닫힘 */
    .tabbar { display: flex; }
    .chatlist { position: absolute; z-index: 4; top: 0; bottom: 0; left: 0; width: min(280px, 85%); transform: translateX(-100%); transition: transform .2s; }
    #chat.listopen .chatlist { transform: none; box-shadow: 4px 0 20px rgba(0,0,0,.1); }
    #chat.listopen .pane::before { content: ''; position: absolute; inset: 0; z-index: 3; background: rgba(16, 24, 40, .35); } /* 목록 밖을 누르면 닫힘 */
    #chat { position: relative; }
    .pane-top { display: block; }
    /* 대시보드와 채팅은 한 칸씩: 위에 둘 다 쌓지 않고, 아래 탭으로 고른 것만 보인다 */
    .home[data-v="chat"] .dash { display: none; }
    .home[data-v="dash"] #chat { display: none; }
    .home[data-v="dash"] .dash { flex: 1; min-height: 0; max-height: none; align-content: start; overflow-y: auto; }
    .dash { grid-template-columns: 1fr; padding: 12px; }
    .lists { grid-template-columns: 1fr; }
    .lcard { max-height: none; }
    #msgs { padding: 14px 10px; }
    .bubble { max-width: 92%; }
    .composer { padding: 8px 10px 10px; }
    .quick { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; } /* 빠른 지시는 한 줄로 옆으로 밀어서 (스크롤바는 안 보이게) */
    .quick button { flex: none; }
    .hint { display: none; }
    textarea, .tgform input, .uform input, .uform select { font-size: 16px; } /* 15px 이하면 아이폰이 입력할 때 화면을 확대해 버린다 */
  }
</style>
</head>
<body>
  <header>
    <button class="icon-btn" id="menuBtn" aria-label="메뉴">☰</button>
    <div class="brand"><span class="bn">나의 AI 비서 </span><span>Sancho</span></div>
    <div class="space"></div>
    <button class="bell" id="bell" title="알림" aria-label="알림" aria-haspopup="dialog" aria-expanded="false">🔔<span class="badge" id="bellN" hidden></span></button>
    <button class="chip" id="who" title="누르면 로그아웃"><span id="whoName"></span><small>로그아웃</small></button>
  </header>
  <div class="bellpanel" id="bellPanel" role="dialog" aria-label="알림 목록" hidden></div>
  <div class="modal" id="noticeModal" hidden>
    <div class="mcard" role="dialog" aria-modal="true" aria-labelledby="nmTitle">
      <div class="mhead"><div class="mt"><h2 id="nmTitle"></h2><div class="meta" id="nmMeta"></div></div><button id="nmClose" aria-label="닫기">✕</button></div>
      <div class="mbody md" id="nmBody"></div>
    </div>
  </div>
  <div class="modal" id="viewer" hidden>
    <div class="mcard" role="dialog" aria-modal="true" aria-labelledby="vTitle">
      <div class="mhead"><div class="mt"><h2 id="vTitle"></h2><div class="meta" id="vMeta"></div></div><button id="vClose" aria-label="닫기">✕</button></div>
      <div class="mbody" id="vBody"></div>
    </div>
  </div>
  <div class="modal" id="pwModal" hidden>
    <form class="mcard" id="pwForm" style="width:min(420px,100%)" role="dialog" aria-modal="true" aria-labelledby="pwTitle">
      <div class="mhead"><div class="mt"><h2 id="pwTitle">비밀번호를 바꿔 주세요</h2><div class="meta">관리자가 정해 준 임시 비밀번호로 처음 들어오셨어요. 나만 아는 새 비밀번호를 정하면 바로 쓸 수 있어요.</div></div></div>
      <div class="mbody uform" style="grid-template-columns:1fr">
        <label>임시 비밀번호 (지금 비밀번호)<input id="pwCur" type="password" autocomplete="current-password" required></label>
        <label>새 비밀번호 (8자 이상)<input id="pwNew" type="password" autocomplete="new-password" required minlength="8"></label>
        <label>새 비밀번호 확인<input id="pwNew2" type="password" autocomplete="new-password" required></label>
        <button class="btn" id="pwBtn" type="submit">바꾸고 시작하기</button>
        <div id="pwMsg" style="color:#b42318;font-size:14px;min-height:1.4em" role="alert"></div>
      </div>
    </form>
  </div>
  <div class="body">
    <nav id="nav"></nav>
    <div class="scrim" id="scrim"></div>
    <main id="main"></main>
  </div>
  <div class="tabbar" id="tabbar" role="tablist" aria-label="화면 바꾸기"><!-- 폰(폭 800px 이하)에서만 보임 -->
    <button type="button" role="tab" data-tab="chat"><i>💬</i>채팅</button>
    <button type="button" role="tab" data-tab="dash"><i>📊</i>대시보드</button>
    <button type="button" role="tab" data-tab="cal"><i>📅</i>일정</button>
  </div>

<script src="/m/db.js"></script>
<script src="/m/cal.js"></script>
<script src="/m/dash.js"></script>
<script src="/m/inbox.js"></script>
<script>
  const MENUS = ['대시보드', '일정', '프로젝트', 'WBS', '메일', '메일정리', '메신저', '알림', '회의록', '결재', '목표', '공수', '지식노트', '워크플로', '설정'];
  const ADMIN_ONLY = ['설정']; // 일반 사용자에게는 메뉴에도 안 보이고, 주소로 들어와도 대시보드로 보낸다 (서버도 막는다)
  const $ = (id) => document.getElementById(id);
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---------- 아주 작은 마크다운 변환기 (표·목록·코드·인용·제목·굵게·링크) ----------
  function inline(s) {
    const codes = [];
    s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
    s = s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*(?!\s)([^*]+?)\*/g, '$1<i>$2</i>');
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return s.replace(/\u0000(\d+)\u0000/g, (_, i) => '<code>' + codes[i] + '</code>');
  }
  function md(src) {
    const L = esc(src).split('\n'), out = [];
    const isTableSep = (l) => l !== undefined && /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l) && l.includes('-');
    const cells = (r) => r.trim().replace(/^\||\|$/g, '').split('|').map((c) => inline(c.trim()));
    const special = (l) => /^```|^#{1,4}\s|^\s*[-*]\s|^\s*\d+\.\s|^&gt;\s?|^---+$/.test(l);
    let i = 0;
    while (i < L.length) {
      const l = L[i];
      if (/^```/.test(l)) { const b = []; i++; while (i < L.length && !/^```/.test(L[i])) b.push(L[i++]); i++; out.push('<pre><code>' + b.join('\n') + '</code></pre>'); continue; }
      if (!l.trim()) { i++; continue; }
      if (l.includes('|') && isTableSep(L[i + 1])) {
        const head = cells(l); i += 2; const rows = [];
        while (i < L.length && L[i].includes('|') && L[i].trim()) rows.push(cells(L[i++]));
        out.push('<table><thead><tr>' + head.map((c) => `<th>${c}</th>`).join('') + '</tr></thead><tbody>' +
          rows.map((r) => '<tr>' + r.map((c) => `<td>${c}</td>`).join('') + '</tr>').join('') + '</tbody></table>');
        continue;
      }
      let m;
      if ((m = l.match(/^(#{1,4})\s+(.*)$/))) { out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++; continue; }
      if (/^---+$/.test(l)) { out.push('<hr>'); i++; continue; }
      if (/^&gt;\s?/.test(l)) { const b = []; while (i < L.length && /^&gt;\s?/.test(L[i])) b.push(inline(L[i++].replace(/^&gt;\s?/, ''))); out.push('<blockquote>' + b.join('<br>') + '</blockquote>'); continue; }
      const ul = /^\s*[-*]\s+/, ol = /^\s*\d+\.\s+/;
      if (ul.test(l) || ol.test(l)) {
        const re = ul.test(l) ? ul : ol, tag = re === ul ? 'ul' : 'ol', b = [];
        while (i < L.length && re.test(L[i])) b.push('<li>' + inline(L[i++].replace(re, '')) + '</li>');
        out.push(`<${tag}>${b.join('')}</${tag}>`); continue;
      }
      const b = [];
      while (i < L.length && L[i].trim() && !special(L[i]) && !(L[i].includes('|') && isTableSep(L[i + 1]))) b.push(inline(L[i++]));
      out.push((/^(⏺|⚠) /.test(b[0]) ? '<p class="' + (b[0][0] === '⏺' ? 'toolline' : 'warnline') + '">' : '<p>') + b.join('<br>') + '</p>');
    }
    return out.join('');
  }

  // ---------- 메뉴 ----------
  let current = '';
  const menus = () => MENUS.filter((m) => myRole === 'admin' || !ADMIN_ONLY.includes(m));
  function renderNav() {
    $('nav').innerHTML = menus().map((m) => `<a href="#${m}" class="${m === current ? 'on' : ''}">${m}</a>`).join('');
  }
  function route() {
    const [h, arg] = decodeURIComponent(location.hash.slice(1)).split('/'); // "#WBS/프로젝트id" 처럼 메뉴 뒤에 붙은 /… 는 그 화면이 쓴다
    current = menus().includes(h) ? h : '대시보드';
    stopDash(); // 대시보드를 떠나면 파일 감시도 끈다 (showChat 이 다시 켠다)
    document.body.classList.remove('menu');
    renderNav();
    if (current === '대시보드') showChat();
    else if (current === '일정') showCalendar();
    else if (current === '프로젝트') showProjects();
    else if (current === 'WBS') showWbs(arg);
    else if (current === '메일정리') showMail();
    else if (current === '메신저') showMessenger(arg);
    else if (current === '회의록') showMeeting();
    else if (current === '결재') showApproval(arg);
    else if (current === '목표') showOkr();
    else if (current === '공수') showManday();
    else if (current === '설정') showSettings(arg);
    else $('main').innerHTML = `<div class="soon"><h2>${current}</h2><p>준비 중입니다. 앞으로 만들어 갈 화면이에요.</p></div>`;
    syncTabs();
  }
  window.addEventListener('hashchange', route);
  $('menuBtn').onclick = () => document.body.classList.toggle('menu');
  $('scrim').onclick = () => document.body.classList.remove('menu');

  // ---------- 휴대폰 아래 탭 (채팅 · 대시보드 · 일정) ----------
  // 폭이 800px 이하면 채팅과 대시보드를 한 칸씩 보여 준다 (CSS 가 .home 의 data-v 를 보고 고른다). 넓은 화면에서는 둘 다 보이므로 data-v 는 상관없다
  let homeView = 'chat'; // 'chat' | 'dash' — 처음엔 비서와 바로 말할 수 있게 채팅
  function syncTabs() {
    const on = current === '일정' ? 'cal' : current === '대시보드' ? homeView : ''; // 다른 메뉴(프로젝트 등)에 있으면 어느 탭도 켜지 않는다
    document.querySelectorAll('#tabbar [data-tab]').forEach((b) => { b.classList.toggle('on', b.dataset.tab === on); b.setAttribute('aria-selected', String(b.dataset.tab === on)); });
    const h = $('home'); if (h) h.dataset.v = homeView;
  }
  function goTab(t) {
    if (t === 'cal') { location.hash = '#일정'; return; }
    homeView = t;
    if (current !== '대시보드') { location.hash = '#대시보드'; return; } // 다른 화면에서 오면 대시보드 화면부터 그린다 (route 가 syncTabs 를 부른다)
    syncTabs();
    if (t === 'chat') scrollDown(true); // 가려져 있던 동안 맨 아래 위치를 잃는다
  }
  $('tabbar').onclick = (e) => { const b = e.target.closest('[data-tab]'); if (b) goTab(b.dataset.tab); };

  // ---------- AI 채팅 ----------
  let chats = [], chatId = null, busy = false, aborter = null;

  const api = async (url, opt) => {
    const r = await fetch(url, opt);
    if (r.status === 401) { location.replace('/'); throw new Error('login'); }
    return r;
  };

  // 빠른 지시: [버튼 글자, 입력창에 채울 글]. 누르면 채우기만 하고 보내지는 않는다
  const QUICK = [['오늘 브리핑'], ['이번 주 일정 정리'], ['마감 임박 알려줘'], ['새 프로젝트 등록', '새 프로젝트 등록: ']];

  function fillInput(text) { // 입력창에 글만 채운다 (보내지는 않는다)
    const t = $('input'); t.value = text;
    t.dispatchEvent(new Event('input')); t.focus(); t.setSelectionRange(t.value.length, t.value.length);
  }

  // ---------- 일정 (public/m/calendar.html 을 메인 화면 안에 띄운다) ----------
  // 채팅 입력창은 대시보드에만 있다. 달력의 "비서에게 시키기"는 글을 부탁만 하고, 여기서 대시보드로 옮겨 채운다
  let pendingAsk = null;
  function showCalendar() { $('main').innerHTML = '<iframe class="frame" src="/m/calendar.html" title="일정"></iframe>'; }
  function showProjects() { $('main').innerHTML = '<iframe class="frame" src="/m/projects.html" title="프로젝트"></iframe>'; }
  function showMessenger(cid) { $('main').innerHTML = `<iframe class="frame" src="/m/messenger.html${cid ? '?c=' + encodeURIComponent(cid) : ''}" title="메신저"></iframe>`; }
  function showMeeting() { $('main').innerHTML = '<iframe class="frame" src="/m/meeting.html" title="회의록" allow="microphone"></iframe>'; } // 음성 인식(녹취)에 마이크가 필요하다
  function showApproval(id) { $('main').innerHTML = `<iframe class="frame" src="/m/approval.html${id ? '?d=' + encodeURIComponent(id) : ''}" title="결재"></iframe>`; }
  function showManday() { $('main').innerHTML = '<iframe class="frame" src="/m/manday.html" title="공수"></iframe>'; }
  function showOkr() { $('main').innerHTML = '<iframe class="frame" src="/m/okr.html" title="목표"></iframe>'; }
  function showMail() { $('main').innerHTML = '<iframe class="frame" src="/m/mail.html" title="메일정리"></iframe>'; }
  function showWbs(pid) { $('main').innerHTML = `<iframe class="frame" src="/m/wbs.html${pid ? '?p=' + encodeURIComponent(pid) : ''}" title="WBS"></iframe>`; }
  window.addEventListener('message', (e) => {
    const frame = document.querySelector('iframe.frame');
    if (e.origin !== location.origin || !frame || e.source !== frame.contentWindow || !e.data || e.data.type !== 'ask') return;
    pendingAsk = String(e.data.text || '');
    homeView = 'chat'; // 폰에서도 글이 채워진 입력창이 바로 보이게
    location.hash = '#대시보드';
  });

  function showChat() {
    $('main').innerHTML = `
      <div class="home" id="home" data-v="${homeView}">
      <div class="dash" id="dashBand"></div>
      <section id="chat">
        <aside class="chatlist"><button class="new" id="newChat">＋ 새 대화</button><div id="list"></div>
          <div class="sched"><h3>예약 <span id="schN"></span></h3><div id="sch"></div></div>
          <div class="memory"><h3>기억 <span id="memN"></span></h3><div id="mem"></div></div></aside>
        <div class="pane">
          <div class="pane-top"><button id="listBtn">📂 대화 목록</button></div>
          <div id="msgs"><div class="wrap" id="thread"></div></div>
          <div class="composer">
            <div class="quick">${QUICK.map(([label, text]) => `<button data-text="${esc(text || label)}">${esc(label)}</button>`).join('')}</div>
            <div class="tray" id="tray" hidden></div>
            <div class="box"><button class="plus" id="plus" type="button" title="파일 첨부 (끌어다 놓거나 Ctrl+V 로 붙여넣어도 돼요)" aria-label="파일 첨부">＋</button><input type="file" id="fileIn" multiple hidden><div class="perm" id="permBadge"></div><textarea id="input" rows="1" placeholder="무엇을 도와드릴까요?"></textarea><button id="send" aria-label="보내기">➤</button></div>
            <div class="hint">Enter 로 보내기 · Shift+Enter 로 줄바꿈 · 파일은 ＋ · 끌어다 놓기 · Ctrl+V</div>
          </div>
        </div>
      </section>
      </div>`;
    document.querySelectorAll('.quick button').forEach((b) => (b.onclick = () => fillInput(b.dataset.text)));
    startDash();
    $('newChat').onclick = () => { if (!busy) openChat(null); $('chat').classList.remove('listopen'); };
    $('listBtn').onclick = () => $('chat').classList.toggle('listopen');
    document.querySelector('#chat .pane').addEventListener('click', (e) => { if (e.target === e.currentTarget) $('chat').classList.remove('listopen'); }); // 서랍이 열려 있을 때 어두운 바깥(.pane 자신)을 누르면 닫힘
    $('send').onclick = () => (busy ? aborter.abort() : send());
    const ta = $('input');
    ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; });
    ta.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); if (!busy) send(); }
    });
    wireAttach(ta);
    setBusy(busy);
    loadPerm();
    loadMemory();
    loadSched();
    loadList().then(() => (chatId ? openChat(chatId) : renderThread([])));
    if (pendingAsk) { fillInput(pendingAsk); pendingAsk = null; } // 다른 화면(일정)에서 "비서에게 시키기"로 넘어온 글
  }

  async function loadList() {
    chats = await (await api('/api/chats')).json();
    renderDash(); // 대시보드의 "최근 대화 3개"도 같이 새로 그린다
    const el = $('list'); if (!el) return;
    el.innerHTML = chats.length ? chats.map((c) => `<button data-id="${c.id}" class="${c.id === chatId ? 'on' : ''}">${esc(c.title)}</button>`).join('')
      : '<div class="none">아직 대화가 없어요.</div>';
    el.querySelectorAll('button').forEach((b) => (b.onclick = () => { if (!busy) openChat(b.dataset.id); $('chat').classList.remove('listopen'); }));
  }

  // 비서의 기억(data/memory.md): 줄마다 삭제 버튼
  async function loadMemory() {
    const el = $('mem'); if (!el) return;
    const items = (await (await api('/api/memory')).json()).items;
    $('memN').textContent = items.length ? `(${items.length})` : '';
    el.innerHTML = items.length
      ? items.map((m) => `<div class="item"><span>${esc(m.text.slice(2))}</span><button data-i="${m.i}" title="이 기억 지우기" aria-label="이 기억 지우기">✕</button></div>`).join('')
      : '<div class="none">아직 기억한 게 없어요. 채팅에서 "기억해: …" 라고 말해 보세요.</div>';
    el.querySelectorAll('button').forEach((b, k) => (b.onclick = async () => {
      if (!confirm('이 기억을 지울까요?\n\n' + items[k].text.slice(2))) return;
      const r = await api('/api/memory/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ i: items[k].i, text: items[k].text }) });
      if (!r.ok) alert((await r.json()).error);
      loadMemory();
    }));
  }

  async function openChat(id) {
    chatId = id;
    if (!id) renderThread([]);
    else renderThread((await (await api('/api/chats/' + id)).json()).messages);
    loadList();
  }

  // ---------- 첨부(＋·끌어다 놓기·붙여넣기)와 파일 카드(비서가 만든 문서) ----------
  // 첨부는 고르는 즉시 POST /api/uploads 로 data/uploads/ 에 올리고, 말을 보낼 때 저장 이름만 같이 보낸다. 비서가 만든 문서는 서버가 data/파일함/ 의 새 파일을 찾아 카드로 알려 준다
  const IMG_TYPE = /^image[/](png|jpe?g|gif|webp)$/;
  const FICON = { docx: '📄', doc: '📄', xlsx: '📊', xls: '📊', csv: '📊', pptx: '📽️', ppt: '📽️', pdf: '📕', png: '🖼️', jpg: '🖼️', jpeg: '🖼️', gif: '🖼️', webp: '🖼️', txt: '📝', md: '📝' };
  const fmtSize = (n) => (n < 1024 ? `${n}B` : n < 1048576 ? `${Math.round(n / 1024)}KB` : `${(n / 1048576).toFixed(1)}MB`);
  const furl = (box, file, q = '') => `/api/files/${encodeURIComponent(box)}/${encodeURIComponent(file)}${q}`;
  let pend = []; // 보내기 전에 올려 둔 첨부: { name, size, type, state: 'up'|'ok'|'err', file(저장 이름), thumb(이미지 미리보기 주소), err }

  function renderTray() {
    const el = $('tray'); if (!el) return;
    el.innerHTML = pend.map((p, i) => `<div class="att ${p.state}" title="${esc(String(p.err || p.name))}">${p.thumb ? `<img src="${esc(p.thumb)}" alt="">` : '<span class="ic">📎</span>'}<span class="nm"><span class="t">${esc(String(p.name))}</span><small>${p.state === 'up' ? '올리는 중…' : p.state === 'err' ? esc(String(p.err)) : fmtSize(p.size)}</small></span><button class="x" type="button" data-rm="${i}" aria-label="첨부 빼기">✕</button></div>`).join('');
    el.hidden = !pend.length;
  }
  async function upload(f, p) {
    try {
      const r = await api('/api/uploads?name=' + encodeURIComponent(p.name), { method: 'POST', headers: { 'Content-Type': p.type }, body: f });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || '올리지 못했어요.');
      Object.assign(p, { file: j.file, name: j.name, size: j.size, type: j.type, state: 'ok' });
    } catch (e) { if (e.message === 'login') return; p.state = 'err'; p.err = e.message === 'Failed to fetch' ? '서버에 연결할 수 없어요.' : e.message; }
    renderTray();
  }
  function addFiles(list) {
    for (const f of [...list]) {
      if (!f || typeof f.size !== 'number') continue;
      if (pend.length >= 10) { alert('첨부는 한 번에 10개까지예요.'); break; }
      const p = { name: f.name || '파일', size: f.size, type: f.type || 'application/octet-stream', state: 'up', thumb: IMG_TYPE.test(f.type) ? URL.createObjectURL(f) : '' };
      pend.push(p); renderTray(); upload(f, p);
    }
  }
  function wireAttach(ta) { // showChat 이 입력창을 새로 그릴 때마다 한 번
    renderTray();
    $('plus').onclick = () => $('fileIn').click();
    $('fileIn').onchange = (e) => { addFiles(e.target.files); e.target.value = ''; };
    $('tray').onclick = (e) => { const b = e.target.closest('[data-rm]'); if (b) { pend.splice(Number(b.dataset.rm), 1); renderTray(); } };
    ta.addEventListener('paste', (e) => { // Ctrl+V: 파일·화면 캡처 그림이면 첨부로. 글이 같이 있으면(워드에서 복사 등) 그냥 글로 붙인다
      const files = [...(e.clipboardData ? e.clipboardData.files : [])];
      if (!files.length || (e.clipboardData.getData('text/plain') || '').trim()) return;
      e.preventDefault();
      const stamp = new Date().toLocaleString('sv-SE').replace(/[-: ]/g, '').replace(/^([0-9]{8})([0-9]{6})$/, '$1-$2');
      addFiles(files.map((f) => (f.name && f.name !== 'image.png' ? f : new File([f], `캡처-${stamp}.png`, { type: f.type }))));
    });
    const pane = document.querySelector('#chat .pane'); let n = 0;
    const has = (e) => [...((e.dataTransfer && e.dataTransfer.types) || [])].includes('Files');
    pane.addEventListener('dragenter', (e) => { if (has(e)) { e.preventDefault(); n++; pane.classList.add('drag'); } });
    pane.addEventListener('dragover', (e) => { if (has(e)) e.preventDefault(); });
    pane.addEventListener('dragleave', () => { if (--n <= 0) { n = 0; pane.classList.remove('drag'); } });
    pane.addEventListener('drop', (e) => { if (!has(e)) return; e.preventDefault(); n = 0; pane.classList.remove('drag'); addFiles(e.dataTransfer.files); });
    $('thread').onclick = (e) => { // 파일 카드의 보기·열기
      const c = e.target.closest('.fcard'); if (!c) return;
      if (e.target.closest('[data-fview]')) openViewer(c.dataset);
      else if (e.target.closest('[data-fopen]')) openFile(c.dataset, e.target.closest('button'));
    };
  }
  const attsHtml = (list) => (Array.isArray(list) && list.length ? `<div class="atts">${list.map((a) => (IMG_TYPE.test(a.type)
    ? `<a class="athumb" href="${furl('uploads', a.file)}" target="_blank" rel="noopener"><img src="${furl('uploads', a.file)}" alt="${esc(String(a.name))}"></a>`
    : `<a class="afile" href="${furl('uploads', a.file, '?dl=1')}" download title="${esc(String(a.name))}">📎 ${esc(String(a.name))}</a>`)).join('')}</div>` : '');
  const filesHtml = (list) => (Array.isArray(list) ? list.map((f) => `<div class="fcard" data-box="${esc(String(f.box))}" data-file="${esc(String(f.file))}" data-name="${esc(String(f.name))}"><span class="ic">${FICON[f.ext] || '📎'}</span><div class="fi"><b>${esc(String(f.name))}</b><small>${esc(String(f.ext || '').toUpperCase())} · ${fmtSize(Number(f.size) || 0)} · 파일함</small></div><div class="fa"><button type="button" data-fview>보기</button><button type="button" data-fopen>열기</button><a href="${furl(f.box, f.file, '?dl=1')}" download>⬇ 받기</a></div></div>`).join('') : '');

  // 파일 보기 창: 서버가 글·표로 풀어 준 것(워드·엑셀·PPT·CSV·텍스트)과 그림·PDF 를 그 자리에서 보여 준다
  const cell = (c) => esc(String(c ?? ''));
  const tableHtml = (rows, more) => `<div class="vt"><table>${rows.map((r, i) => `<tr>${r.map((c) => (i === 0 ? `<th>${cell(c)}</th>` : `<td>${cell(c)}</td>`)).join('')}</tr>`).join('')}</table></div>${more ? '<p class="soft">앞부분만 보여 줘요. 전체는 열기나 ⬇ 받기로 보세요.</p>' : ''}`;
  function viewHtml(v) {
    if (v.kind === 'image') return `<img class="vimg" src="${esc(v.url)}" alt="">`;
    if (v.kind === 'pdf') return `<iframe class="vpdf" src="${esc(v.url)}" title="PDF"></iframe>`;
    if (v.kind === 'text') return `<pre>${cell(v.text)}</pre>${v.more ? '<p class="soft">앞부분만 보여 줘요.</p>' : ''}`;
    if (v.kind === 'doc') return `<div class="vdoc">${v.blocks.map((b) => (b.t === 'table' ? tableHtml(b.rows, false) : b.t === 'h' ? `<h${b.level + 1}>${cell(b.text)}</h${b.level + 1}>` : `<p>${cell(b.text)}</p>`)).join('')}</div>`;
    if (v.kind === 'sheet') return v.sheets.map((s) => `<h4>${cell(s.name)}</h4>${s.rows.length ? tableHtml(s.rows, s.more) : '<p class="soft">비어 있어요.</p>'}`).join('');
    if (v.kind === 'slides') return v.slides.map((s) => `<div class="slide"><b>슬라이드 ${s.n}</b>${s.texts.length ? `<ul>${s.texts.map((t) => `<li>${cell(t)}</li>`).join('')}</ul>` : '<p class="soft">글이 없어요.</p>'}</div>`).join('');
    return `<p class="soft">${cell(v.error || '이 형식은 미리보기가 없어요.')}</p>`;
  }
  async function openViewer(d) {
    $('vTitle').textContent = d.name || d.file; $('vMeta').textContent = '글과 표만 보여 줘요 (서식·그림은 "열기"로 진짜 프로그램에서)';
    $('vBody').innerHTML = '<p class="soft">불러오는 중…</p>'; $('viewer').hidden = false; $('vClose').focus();
    try { $('vBody').innerHTML = viewHtml(await (await api(furl(d.box, d.file, '?view=1'))).json()); }
    catch (e) { if (e.message !== 'login') $('vBody').innerHTML = '<p class="soft">미리보기를 불러오지 못했어요.</p>'; }
  }
  async function openFile(d, btn) { // 이 PC 에 설치된 프로그램(워드·엑셀 등)으로 연다
    const old = btn.textContent; btn.disabled = true; btn.textContent = '여는 중…';
    try {
      const r = await api('/api/files/open', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ box: d.box, name: d.file }) });
      if (!r.ok) alert((await r.json().catch(() => ({}))).error || '열지 못했어요.');
    } catch (e) { if (e.message !== 'login') alert('서버에 연결할 수 없습니다.'); }
    btn.disabled = false; btn.textContent = old;
  }
  const closeViewer = () => { $('viewer').hidden = true; $('vBody').innerHTML = ''; };
  $('vClose').onclick = closeViewer;
  $('viewer').onclick = (e) => { if (e.target === $('viewer')) closeViewer(); };
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('viewer').hidden) closeViewer(); });

  const bubble = (role, html, cls = '') => `<div class="row ${role}"><div class="bubble ${cls}">${html}</div></div>`;
  function renderThread(messages) {
    $('thread').innerHTML = messages.length
      ? messages.map((m) => m.role === 'user' ? bubble('user', attsHtml(m.attachments) + esc(m.content)) : bubble('assistant', md(m.content) + filesHtml(m.files), 'md')).join('')
      : '<div class="empty"><h2>무엇을 도와드릴까요?</h2><p>아래 입력창에 말을 걸어 보세요.</p></div>';
    scrollDown(true);
  }
  function scrollDown(force) {
    const m = $('msgs');
    if (force || m.scrollHeight - m.scrollTop - m.clientHeight < 120) m.scrollTop = m.scrollHeight;
  }
  function setBusy(b) {
    busy = b;
    const s = $('send'); if (!s) return;
    s.textContent = b ? '■' : '➤'; s.classList.toggle('stop', b); s.setAttribute('aria-label', b ? '중지' : '보내기');
  }

  async function send() {
    const ta = $('input'), text = ta.value.trim();
    if (busy) return;
    if (pend.some((p) => p.state === 'up')) { alert('파일을 올리는 중이에요. 다 올라간 뒤에 보내 주세요.'); return; }
    const atts = pend.filter((p) => p.state === 'ok').map((p) => ({ file: p.file, name: p.name, size: p.size, type: p.type }));
    if (!text && !atts.length) return;
    if (!chatId) { // 첫 말이면 대화부터 만든다. 실패하면 쓴 글을 지우지 않고 알려 준다
      try { chatId = (await (await api('/api/chats', { method: 'POST' })).json()).id; }
      catch { alert('서버에 연결할 수 없습니다. 서버(start.bat)가 켜져 있는지 확인해 주세요.'); return; }
    }
    ta.value = ''; ta.style.height = 'auto';
    if ($('thread').querySelector('.empty')) $('thread').innerHTML = '';
    $('thread').insertAdjacentHTML('beforeend', bubble('user', attsHtml(atts) + esc(text || '첨부한 파일을 읽어 줘.')) + bubble('assistant', '<span class="typing">…</span>', 'md'));
    const out = $('thread').lastElementChild.firstElementChild;
    pend = []; renderTray();
    scrollDown(true);
    aborter = new AbortController(); setBusy(true);
    let got = '', cards = '', willRestart = false;
    try {
      const r = await api(`/api/chats/${chatId}/messages`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: text, attachments: atts.map((a) => a.file) }), signal: aborter.signal });
      if (!r.ok) { const j = await r.json().catch(() => ({})); out.innerHTML = md("⚠ " + (j.error || "보내지 못했습니다.")); throw new Error("rejected"); }
      const reader = r.body.getReader(), dec = new TextDecoder();
      let buf = '';
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let k;
        while ((k = buf.indexOf('\n\n')) >= 0) {
          const ev = buf.slice(0, k); buf = buf.slice(k + 2);
          const d = ev.split('\n').find((x) => x.startsWith('data: '));
          if (!ev.startsWith('event:') && d) { got += JSON.parse(d.slice(6)).t; out.innerHTML = md(got); scrollDown(false); }
          else if (ev.startsWith('event: files') && d) cards = filesHtml(JSON.parse(d.slice(6))); // 비서가 이번에 만든 문서: 글이 끝난 뒤 카드로
          else if (ev.startsWith('event: restart')) willRestart = true; // 자기 수정이 검사를 통과해 서버가 다시 켜진다 → 다 켜지면 화면을 새로 고친다
        }
      }
      if (cards) { out.insertAdjacentHTML('beforeend', cards); scrollDown(true); }
      if (willRestart) { setBusy(false); aborter = null; await waitRestart((t) => { out.insertAdjacentHTML('beforeend', `<p class="typing">${esc(t)}</p>`); scrollDown(true); }); return; }
    } catch (e) {
      if (e.name !== 'AbortError' && e.message !== 'login' && e.message !== 'rejected') out.innerHTML = md(got) + '<p class="typing">(연결이 끊어졌습니다.)</p>';
    }
    if (!got && !out.querySelector('p') && !out.querySelector('.warnline')) out.innerHTML = '<span class="typing">(중지했습니다.)</span>';
    setBusy(false); aborter = null;
    loadList(); loadMemory(); // 비서가 방금 기억을 적었을 수 있다
    loadPerm(); // 다른 곳(설정 화면·다른 탭)에서 바뀐 권한이 입력창 왼쪽 표시에 남지 않게
    if ($('input')) $('input').focus();
  }

  // ---------- 대시보드 (채팅 위): 자료는 db.js 로 받고, 파일이 바뀌면 바로 다시 그린다 ----------
  const DASH_DATA = ['events', 'projects', 'tasks']; // 알림(notices)은 🔔 가 받아 두고 대시보드 카드도 그걸 쓴다 (아래 "🔔 알림")
  let me = '', myRole = 'user', dashData = { bad: [] }, dashSeq = 0, dashOff = [], apprTodo = 0; // apprTodo: 내가 결재할 차례인 문서 수 (결재 메뉴와 같은 계산을 서버가 해 준다)
  const safe = (v) => esc(String(v ?? '')); // 파일에서 온 글자는 화면에 넣기 전에 꼭 거른다

  async function loadDash() {
    const my = ++dashSeq, bad = [];
    const got = await Promise.all(DASH_DATA.map((n) => db.list(n).catch(() => (bad.push(n), []))));
    if (my !== dashSeq) return; // 더 새 요청이 있거나 대시보드를 떠났다
    dashData = { ...Object.fromEntries(DASH_DATA.map((n, i) => [n, got[i]])), bad };
    renderDash();
  }
  async function loadApprTodo() { // 대시보드 카드 숫자. 못 읽으면 이전 숫자를 그대로 둔다
    try { const j = await (await api('/api/approvals/summary')).json(); apprTodo = Number.isInteger(j.todo) ? j.todo : 0; } catch { /* 숫자 하나만 못 읽음 */ }
    renderDash();
  }
  function startDash() {
    stopDash();
    loadDash(); loadApprTodo();
    const tick = setInterval(renderDash, 60000); // 인사말·"오늘"이 시간 따라 바뀌게
    dashOff = [...DASH_DATA.map((n) => db.watch(n, loadDash)), db.watch('schedule', loadSched), db.watch('approvals', loadApprTodo), () => clearInterval(tick)]; // 예약 칸도 같이 (대시보드에 있는 동안만)
  }
  function stopDash() { dashSeq++; dashOff.forEach((f) => f()); dashOff = []; }

  function renderDash() {
    const el = $('dashBand'); if (!el) return;
    const now = new Date(), s = dash.stats({ ...dashData, notices: noticeRaw }, now); // 알림은 🔔 가 받아 둔 것: 단추 숫자와 같은 자료라 어긋나지 않는다
    const when = (iso) => { const d = new Date(iso); return d.toLocaleDateString('sv-SE') === now.toLocaleDateString('sv-SE')
      ? d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false }) : `${d.getMonth() + 1}/${d.getDate()}`; };
    const list = (rows, none) => rows.length ? `<ul>${rows.join('')}</ul>` : `<div class="none">${none}</div>`;
    const bad = [...dashData.bad, ...(noticeBad ? ['notices'] : [])].map((n) => LABELS[n]).join('·');
    const probs = cal.problems(dashData.events, dashData.tasks);
    el.innerHTML = `
      <div>
        <div class="hello"><h2>${safe(dash.greeting(now, me))}</h2><span class="date">${now.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' })}</span></div>
        ${bad ? `<div class="note">⚠ ${bad} 자료를 읽지 못했어요. data/db 의 파일을 확인해 주세요.</div>` : ''}
        ${probs.length ? `<div class="note" title="${safe(probs.join('\n'))}">⚠ 형식이 맞지 않는 항목 ${probs.length}개는 세지 않았어요. 일정 메뉴에서 자세히 보여요.</div>` : ''}
        <div class="stats">
          <a class="stat" href="#일정"><b>${s.todayEvents.length}</b><span>오늘 일정</span></a>
          <a class="stat" href="#프로젝트"><b>${s.activeProjects}</b><span>진행 중 프로젝트</span></a>
          <a class="stat ${s.overdue ? 'warn' : ''}" href="#WBS"><b>${s.dueSoon.length}</b><span>7일 안 마감 할 일${s.overdue ? ` (지난 것 ${s.overdue})` : ''}</span></a>
          <a class="stat" href="#알림"><b>${s.unread}</b><span>안 읽은 알림</span></a>
          <a class="stat wide ${apprTodo ? 'warn' : ''}" href="#결재"><b>${apprTodo}</b><span>결재할 문서</span></a>
        </div>
      </div>
      <div class="lists">
        <div class="lcard"><h3>오늘 일정</h3>${list(s.todayEvents.map((e) =>
          `<li title="${safe(e.place)}"><span class="k">${safe(e.start || '종일')}</span><span class="tt">${safe(e.title)}</span></li>`), '오늘은 일정이 없어요.')}</div>
        <div class="lcard"><h3>마감 임박 할 일</h3>${list(s.dueSoon.map((t) => {
          const d = dash.dday(t.due, now);
          return `<li><span class="k ${d.endsWith('지남') ? 'late' : ''}">${safe(d)}</span><span class="tt">${safe(t.title)}</span></li>`; }), '7일 안에 마감인 할 일이 없어요.')}</div>
        <div class="lcard"><h3>최근 대화</h3>${list(chats.slice(0, 3).map((c) =>
          `<li data-chat="${safe(c.id)}"><span class="k">${when(c.updatedAt)}</span><span class="tt">${safe(c.title)}</span></li>`), '아직 대화가 없어요.')}</div>
      </div>`;
    el.querySelectorAll('[data-chat]').forEach((li) => (li.onclick = () => { if (!busy) { openChat(li.dataset.chat); goTab('chat'); } })); // 폰에서는 눌러 연 대화가 바로 보이게 채팅 칸으로
  }

  // ---------- 🔔 알림 (data/db/notices.json): 위쪽 단추(안 읽은 수 배지) → 목록 → 누르면 결과 전체 ----------
  // 알림 메뉴·대시보드의 "안 읽은 알림" 카드(href="#알림")를 눌러도 같은 목록이 열린다
  let noticeRaw = [], noticeBad = false, noticeSeq = 0;
  const unreadN = () => dash.stats({ notices: noticeRaw }, new Date()).unread; // 대시보드 카드와 같은 계산

  async function loadNotices() {
    const my = ++noticeSeq;
    let got, bad = false;
    try { got = await db.list('notices'); } catch { got = []; bad = true; }
    if (my !== noticeSeq) return;
    noticeRaw = got; noticeBad = bad;
    renderBell(); renderDash(); // 단추 숫자와 대시보드 카드 숫자를 같이 바꾼다
  }
  function renderBell() {
    const n = unreadN(), b = $('bellN');
    b.hidden = !n; b.textContent = n > 99 ? '99+' : String(n);
    $('bell').setAttribute('aria-label', n ? `알림 (안 읽은 ${n}개)` : '알림');
    if (!$('bellPanel').hidden) renderBellPanel();
  }
  function renderBellPanel() {
    const all = inbox.notices(noticeRaw), shown = all.slice(0, 50), now = new Date(), n = unreadN(), el = $('bellPanel');
    el.innerHTML = `<div class="bp-head"><span>알림${n ? ` · 안 읽음 ${n}` : ''}</span><button id="readAll" ${n ? '' : 'disabled'}>모두 읽음</button></div>
      <div class="bp-list">${shown.length ? shown.map((x, i) => `<button class="nrow ${x.read ? '' : 'unread'} ${x.level === '주의' ? 'warn' : ''}" data-i="${i}">
        <span class="dot"></span><span class="nt"><b>${safe(x.title)}</b><span>${safe(x.body)}</span></span><time>${safe(inbox.when(x.at, now))}</time></button>`).join('')
        : '<div class="bp-none">아직 알림이 없어요.</div>'}</div>
      ${all.length > shown.length ? `<div class="bp-foot">오래된 알림 ${all.length - shown.length}개는 접어 두었어요.</div>` : ''}`;
    el.querySelectorAll('.nrow').forEach((b) => (b.onclick = () => openNotice(shown[b.dataset.i])));
    $('readAll').onclick = async () => {
      await Promise.all(all.filter((x) => !x.read && x.id).map((x) => db.save('notices', x.id, { ...x.raw, read: true }).catch(() => {})));
      loadNotices();
    };
  }
  function openBell() { document.body.classList.remove('menu'); renderBellPanel(); $('bellPanel').hidden = false; $('bell').setAttribute('aria-expanded', 'true'); }
  function closeBell() { $('bellPanel').hidden = true; $('bell').setAttribute('aria-expanded', 'false'); }
  function openNotice(x) { // 결과 전체를 창으로 보여 주고, 읽음으로 바꾼다
    closeBell();
    $('nmTitle').textContent = x.title;
    $('nmMeta').innerHTML = `<span class="lvl ${x.level === '주의' ? 'warn' : ''}">${x.level}</span> ${safe(inbox.full(x.at))}`;
    $('nmBody').innerHTML = md(x.detail || x.body || '(내용이 없어요.)'); // 글자는 md() 가 먼저 거른다
    $('noticeModal').hidden = false; $('nmClose').focus();
    if (!x.read && x.id) { // 화면 숫자는 바로 바꾸고, 파일에는 읽음으로 저장한다
      x.raw.read = true; renderBell(); renderDash();
      db.save('notices', x.id, x.raw).then(loadNotices).catch(loadNotices);
    }
  }
  const closeNotice = () => { $('noticeModal').hidden = true; };
  $('bell').onclick = () => ($('bellPanel').hidden ? openBell() : closeBell());
  $('nmClose').onclick = closeNotice;
  $('noticeModal').onclick = (e) => { if (e.target === $('noticeModal')) closeNotice(); };
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (!$('noticeModal').hidden) closeNotice(); else closeBell(); } });
  document.addEventListener('click', (e) => {
    if (e.target.closest('a[href="#알림"]')) { e.preventDefault(); openBell(); } // 메뉴 "알림"·대시보드 카드
    else if (!e.target.closest('#bell, #bellPanel')) closeBell(); // 바깥을 누르면 닫힘
  });

  // ---------- 예약 칸 (채팅 왼쪽, data/schedule.json): 켬/끔 스위치 · ▶ 지금 실행 · ✕ 삭제 ----------
  let schedItems = [], schedErr = '', schedSeq = 0, schedTelegram = false; // schedTelegram: 텔레그램 설정(봇 토큰·채팅 ID)이 저장돼 있는지
  async function loadSched() {
    const my = ++schedSeq;
    let items = [], err = '', tg = false;
    try {
      const r = await api('/api/schedule'), j = await r.json();
      if (!r.ok) throw new Error(j.error || '예약을 읽지 못했어요.');
      items = j.items; tg = !!j.telegram;
    } catch (e) { if (e.message === 'login') return; err = e.message; }
    if (my !== schedSeq) return;
    schedItems = items; schedErr = err; schedTelegram = tg;
    renderSched();
  }
  function renderSched() {
    const el = $('sch'); if (!el) return;
    $('schN').textContent = schedItems.length ? `(${schedItems.length})` : '';
    el.innerHTML = schedErr ? `<div class="none">⚠ ${safe(schedErr)}</div>` : schedItems.length ? schedItems.map((e, i) => {
      const id = typeof e.id === 'string' ? e.id : '', on = e.켬 !== false, run = !!e.running;
      const admin = myRole === 'admin', ph = admin && e.휴대폰 === true, sub = e.error ? `⚠ ${e.error}` : run ? '⏳ 실행 중…' : inbox.scheduleText(e.언제) + (ph && !schedTelegram ? ' · ⚠ 텔레그램 설정 필요' : '');
      return `<div class="sitem ${on ? '' : 'off'} ${e.error ? 'bad' : ''}" title="${safe(e.지시문)}">
        <label class="sw" title="${on ? '켜짐 (누르면 끔)' : '꺼짐 (누르면 켬)'}"><input type="checkbox" data-i="${i}" ${on ? 'checked' : ''} ${id ? '' : 'disabled'}><span></span></label>
        <div class="st"><b>${safe(e.이름 || id || '(이름 없음)')}</b><small>${safe(sub)}</small></div>
        ${admin ? `<label class="ph" title="${ph ? '결과 요약을 휴대폰(텔레그램)으로도 보냄 (누르면 끔)' : '휴대폰(텔레그램)으로도 보내기 (누르면 켬)'}"><input type="checkbox" data-phone="${i}" ${ph ? 'checked' : ''} ${id ? '' : 'disabled'} aria-label="휴대폰으로도 보내기"><span>📱</span></label>` : ''}
        <button data-run="${i}" title="지금 한 번 실행 (예약 시각은 그대로)" aria-label="지금 실행" ${id && !e.error && !run ? '' : 'disabled'}>▶</button>
        <button data-del="${i}" title="이 예약 지우기" aria-label="이 예약 지우기" ${id ? '' : 'disabled'}>✕</button></div>`;
    }).join('') : '<div class="none">아직 예약이 없어요. 채팅에서 "매일 아침 8시 반에 … 해 줘" 라고 말해 보세요.</div>';
    el.querySelectorAll('input[data-i]').forEach((c) => (c.onchange = () => schedCall(schedItems[c.dataset.i].id, 'enable', { on: c.checked })));
    el.querySelectorAll('input[data-phone]').forEach((c) => (c.onchange = async () => {
      const on = c.checked;
      await schedCall(schedItems[c.dataset.phone].id, 'phone', { on });
      if (on && !schedTelegram) alert('텔레그램 설정이 아직 비어 있어서 지금은 보내지지 않아요.\n설정 → "텔레그램 배달"에서 봇 토큰과 채팅 ID 를 입력해 주세요.');
    }));
    el.querySelectorAll('[data-run]').forEach((b) => (b.onclick = () => schedCall(schedItems[b.dataset.run].id, 'run')));
    el.querySelectorAll('[data-del]').forEach((b) => (b.onclick = () => {
      const e = schedItems[b.dataset.del];
      if (confirm(`이 예약을 지울까요?\n\n${e.이름 || e.id} — ${inbox.scheduleText(e.언제)}`)) schedCall(e.id);
    }));
  }
  async function schedCall(id, act, body) { // act 없으면 삭제
    try {
      const r = await api(`/api/schedule/${encodeURIComponent(id)}${act ? '/' + act : ''}`, { method: act ? 'POST' : 'DELETE',
        headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
      if (!r.ok) alert((await r.json().catch(() => ({}))).error || '처리하지 못했어요.');
    } catch (e) { if (e.message !== 'login') alert('서버에 연결할 수 없습니다.'); }
    loadSched(); // 실패했어도 스위치 모양을 실제 상태로 되돌린다
  }

  // ---------- 권한 (설정 → 권한, 채팅 입력창 왼쪽 표시): data/settings.json 의 "권한". 기본은 전부 꺼짐 ----------
  // [서버의 칸 이름, 제목, 입력창 표시, 설명, 켤 때 되묻는 말(위험한 것만)]
  const PERMS = [
    ['연결된앱', '연결된 앱 (Gmail · 캘린더 · 드라이브)', '🔌 앱', '비서가 메일·일정·문서를 읽고, 메일 초안과 드라이브 문서를 만들 수 있어요. 메일은 보내기 전에 꼭 "보낼까요?" 하고 묻고, 내가 "네" 해야 보여 준 주소로 한 통만 갑니다. 구글 캘린더 등록도 "등록할까요?" 하고 물어요(초대 메일이 나갈 수 있어서). 지우기·공유는 못 해요.'],
    ['명령실행', '명령 실행', '⌨ 명령', '비서가 이 컴퓨터에서 명령(프로그램)을 실행할 수 있어요. 엑셀·워드 문서를 만들 때 필요해요. 켜져 있는 동안 비서는 이 PC 에서 거의 무엇이든 할 수 있어서(파일 지우기·설치·설정 파일 고치기·다른 프로그램으로 메일 보내기까지 완전히 막지는 못해요) 꼭 필요할 때만 켜고 끝나면 꺼 두세요. 예약·메일정리처럼 내가 보고 있지 않은 일에는 쓰이지 않아요.',
      '명령 실행을 켤까요?\n\n켜져 있는 동안 비서는 이 PC 에서 거의 무엇이든 할 수 있어요. 파일 지우기·설치, 설정 파일 고치기, 다른 프로그램으로 메일 보내기까지 완전히 막지는 못해요.\n연결된 앱과 함께 켜 두면 메일 속 지시 때문에 명령이 돌 위험도 있어요.\n꼭 필요할 때만 켜고, 끝나면 꺼 두세요.'],
    ['홈폴더', '내 홈 폴더 읽기', '📁 홈', '비서가 내 사용자 폴더(문서·바탕화면 등)의 파일을 읽을 수 있어요. 고치거나 지우지는 못해요. 로그인 열쇠가 있는 폴더(.ssh 등)는 늘 막혀 있어요.'],
    ['자기수정', '자기 수정 (비서가 이 앱의 코드를 고침)', '🛠 수정', '비서가 이 앱의 코드(화면·서버)를 직접 고칠 수 있어요. 답이 끝나면 서버가 검사(문법·selftest, 몇 분)해서 통과하면 저장(커밋)하고 서버를 다시 켜요. 실패하면 바뀐 것을 모두 되돌리고 채팅에 이유를 보여 줘요. start.bat·검사 핵심 파일은 못 고쳐요. 켜져 있는 동안 비서에게 "명령 실행"은 주어지지 않아요. 서버를 start.bat 으로 켰고 앱 폴더에 저장 안 한 변경이 없을 때만 동작해요.',
      '자기 수정을 켤까요?\n\n비서가 이 앱의 코드를 직접 고칠 수 있게 돼요. 답이 끝나면 서버가 검사해서 통과하면 저장하고 서버를 다시 켜고(그동안 진행 중인 다른 답변·예약 실행은 끊겨요), 실패하면 모두 되돌려요.\nstart.bat·검사 핵심 파일은 못 고쳐요. 켜져 있는 동안 비서에게 "명령 실행"은 주어지지 않아요.'],
  ];
  let perm = {};
  async function loadPerm() { // 켜진 권한을 받아 입력창 왼쪽 표시를 그린다 (못 받으면 마지막 값 그대로)
    if (myRole !== 'admin') { if ($('permBadge')) $('permBadge').hidden = true; return; } // 일반 사용자에게는 권한 스위치도 그 표시도 없다
    try { const r = await api('/api/settings'); if (r.ok) perm = (await r.json()).permissions || {}; } catch {}
    const el = $('permBadge'); if (!el) return;
    const on = PERMS.filter(([k]) => perm[k]), names = on.map((p) => p[1]).join(', ');
    el.innerHTML = on.length ? on.map(([k, , chip]) => `<span class="${k === '명령실행' || k === '자기수정' ? 'warn' : ''}">${esc(chip)}</span>`).join('') : '<span class="lock">🔒</span>';
    el.title = on.length ? `지금 켜진 권한: ${names}` : '권한이 모두 꺼져 있어요 (설정 → 권한에서 켤 수 있어요)';

  }
  async function showPerm() { // 설정 화면의 권한 스위치: 켜고 끄면 바로 저장
    await loadPerm();
    const msg = (t, err) => { const m = $('permMsg'); if (m) { m.textContent = t; m.className = err ? 'err' : ''; } };
    document.querySelectorAll('input[data-perm]').forEach((c) => {
      c.checked = !!perm[c.dataset.perm]; c.disabled = false;
      c.onchange = async () => {
        const k = c.dataset.perm, on = c.checked, p = PERMS.find((x) => x[0] === k);
        if (on && p[4] && !confirm(p[4])) { c.checked = false; return; }
        c.disabled = true;
        try {

      $('pwBtn').disabled = true; msg('');
      try {
        const r = await fetch('/api/auth/password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ current: $('pwCur').value, next: $('pwNew').value }) });
        if (r.ok) return location.reload();
        msg((await r.json().catch(() => ({}))).error || '바꾸지 못했어요.');
      } catch { msg('서버에 연결할 수 없습니다.'); }
      $('pwBtn').disabled = false;
    };
  }
  fetch('/api/me').then((r) => (r.ok ? r.json() : Promise.reject()))
    .then((u) => {
      me = u.name; myRole = u.role; $('whoName').textContent = u.dept ? `${u.name} · ${u.dept}` : u.name; $('who').title = `${u.role === 'admin' ? '관리자' : '일반 사용자'} · 누르면 로그아웃`;
      if (u.mustChange) return askNewPassword();
      loadNotices(); db.watch('notices', loadNotices); route();
    })
    .catch(() => location.replace('/'));
</script>
</body>
</html>
